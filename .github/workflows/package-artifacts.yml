name: Package source artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ZIP and TAR.GZ
        shell: bash
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=openStawks/ --output=artifacts/openclaw-stock-analyst-pi.zip HEAD
          git archive --format=tar --prefix=openStawks/ HEAD | gzip -9 > artifacts/openclaw-stock-analyst-pi.tar.gz
          sha256sum artifacts/openclaw-stock-analyst-pi.zip artifacts/openclaw-stock-analyst-pi.tar.gz > artifacts/SHA256SUMS

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-stock-analyst-pi-zip
          path: artifacts/openclaw-stock-analyst-pi.zip
          if-no-files-found: error

      - name: Upload TAR.GZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-stock-analyst-pi-tar-gz
          path: artifacts/openclaw-stock-analyst-pi.tar.gz
          if-no-files-found: error

      - name: Keep packaged artifacts on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/openclaw-stock-analyst-pi.zip \
                     artifacts/openclaw-stock-analyst-pi.tar.gz \
                     artifacts/SHA256SUMS
          if git diff --cached --quiet; then
            echo "Packaged artifacts are already current."
          else
            git commit -m "Update packaged artifacts [skip ci]"
            git push
          fi
