name: Package source artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ZIP and TAR.GZ
        shell: bash
        run: |
          git archive --format=zip --prefix=openStawks/ --output=openclaw-stock-analyst-pi.zip HEAD
          git archive --format=tar --prefix=openStawks/ HEAD | gzip -9 > openclaw-stock-analyst-pi.tar.gz

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-stock-analyst-pi-zip
          path: openclaw-stock-analyst-pi.zip
          if-no-files-found: error

      - name: Upload TAR.GZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-stock-analyst-pi-tar-gz
          path: openclaw-stock-analyst-pi.tar.gz
          if-no-files-found: error
